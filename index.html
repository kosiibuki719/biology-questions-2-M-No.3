{t:"サポートチャレンジ 38〜40　神経細胞／心臓の拍動調節／脳の構造",p:"解答集 p.37〜38",parts:[

{t:"17 ホルモンによる情報伝達",p:"解答集 p.38〜39",parts:[
 {h:"① ホルモンによる調節",q:[
  "ホルモンは、[[a:内分泌腺]]と呼ばれる器官の細胞によってつくられ、[[b:血液|体液]]中に分泌される。",
  "ホルモンは分泌される場所と作用する場所が離れていることが多く、(b)など体液の循環によって体全体に行き渡ることで、特定の細胞にはたらきかける。このように、ホルモンがはたらきかける細胞を[[c:標的]]細胞と呼び、(c)細胞を含む器官を(c)器官という。",
  "ホルモンは(b)などの循環によって情報を伝達する化学物質であるため、[[d:神経]]系のように速く情報を伝達することはできないが、[[e:体内|体内環境]]の状態が安定するまで(c)細胞に持続的な調節を行うことができる。",

  "ホルモンは、(c)細胞の(f)に受容されると、その細胞に作用する。受容されたホルモンは、(c)細胞に作用した後は、速やかに[[g:分解]]される。",
  "1種類のホルモンが、複数の種類の(c)細胞や(c)器官に作用することもあり、異なる作用を引き起こすことがある。例えば、[[h:副腎髄質]]から分泌されるホルモンであるアドレナリンは、[[i:肝臓]]などの器官に作用して血糖濃度を[[j:増加|上昇]]させるホルモンであるが、心臓に作用すると[[k:心拍]]数を増加させ、眼の筋肉に作用すると[[l:瞳孔]]を散大させるなど、複数の作用がある。",
  "アドレナリンは、筋肉では血管を[[m:拡張]]させて[[n:血流]]量を増加させるのに対して、皮膚や粘膜では血管を[[o:収縮]]させて(n)量を減少させる逆の作用を示す。"]},
 {h:"② ホルモンの分泌量の調節",q:[

  "のどの近くの[[b:甲状腺]]という内分泌腺からは、チロキシンというホルモンが分泌される。",
  "チロキシンは、全身の細胞に作用し、全身の[[c:代謝]]を高めるはたらきをもつ。",
  "[[d:視床下部|間脳視床下部@w]]や脳下垂体[[e:前葉]]は、体内のチロキシン濃度を適切な濃度に保つためのセンサーの役目をもつ。",
  "(a)中のチロキシン濃度が高すぎたり低すぎたりすると、(d)や脳下垂体(e)に感知される。その後、(d)から分泌される[[f:甲状腺刺激ホルモン放出ホルモン@w]]と、脳下垂体(e)から分泌される[[g:甲状腺刺激ホルモン@w]]の分泌量がそれぞれ調節され、一連の反応全体でチロキシン濃度が適切な濃度に調節される。",
  "このように、一連の反応系を経て生じた分泌物やその効果が、前の段階に戻って影響を及ぼすことを[[h:フィードバック|負のフィードバック@w]]という。"]}
 ]},

const STMT41=[
 "右図は、外分泌腺を模式的に表したものであり、a は血管、b は排出管をそれぞれ表している。",
 "右図は、内分泌腺を模式的に表したものであり、a、b はともに血管を表している。",
 "右図は、内分泌腺を模式的に表したものであり、a は血管、b は排出管をそれぞれ表している。",
 "ホルモンには内分泌されるものと、外分泌されるものがある。",
 "1種類のホルモンが、複数の種類の標的細胞に作用する場合もある。",
 "ホルモンによる情報の伝達は、神経系による情報の伝達より遅い。",
 "ホルモンによる情報の伝達は、神経系による情報の伝達より持続的である。"];
const ANS41=[1,4,5,6];   // ②⑤⑥⑦

const root=document.getElementById('root');
const checks=[];
const groups={};   // name -> [idx]
let ok41=false;

const norm=s=>s.normalize('NFKC').replace(/[\s　>＞→・、,，()（）「」]/g,'').toLowerCase();

function bl(label,spec){
  const idx=checks.length,id='f'+idx;
  let b;
  if(spec.startsWith('@sel:')){
    const n=+spec.slice(5);
    let h=`<select id="${id}"><option value="">--</option>`;
    OPT22.forEach((o,i)=>h+=`<option value="${i+1}">${NUM[i]} ${o}</option>`);
    b={type:'sel',ans:n,show:OPT22[n-1],idx,id};
    b.html=`<span class="b"><sup>(${label})</sup>${h}</select><span class="ans" id="${id}a"></span></span>`;
  }else if(spec.startsWith('@ch:')){
    const [o,a]=spec.slice(4).split(':'),opts=o.split(',');
    let h=`<select id="${id}"><option value="">--</option>`+opts.map(x=>`<option value="${x}">${x}</option>`).join('')+'</select>';
    b={type:'ch',ans:a,show:a,idx,id};
    b.html=`<span class="b"><sup>(${label})</sup>${h}<span class="ans" id="${id}a"></span></span>`;
  }else{
    let grp=null;
    if(spec.includes('#')){[spec,grp]=spec.split('#');}
    let wide=false;
    if(spec.endsWith('@w')){wide=true;spec=spec.slice(0,-2);}
    const alts=spec.split('|');
    b={type:'txt',alts,show:alts[0],grp,idx,id};
    b.html=`<span class="b"><sup>(${label})</sup><input class="blank${wide||alts[0].length>6?' w':''}" id="${id}" autocomplete="off" spellcheck="false"><span class="ans" id="${id}a"></span></span>`;
    if(grp){(groups[grp]=groups[grp]||[]).push(idx);}
  }
  checks.push(b);return b;
}

function render(){
  DATA.forEach(c=>{
    const sec=document.createElement('section');sec.className='chap';
    let h=`<h2>${c.t}<small>${c.p}</small></h2><div class="body">`;
    c.parts.forEach(p=>{
      h+=`<h3>${p.h}</h3>`;
      if(p.opts){
        h+='<div class="opts">'+OPT22.map((o,i)=>`<span>${NUM[i]} ${o}</span>`).join('')+'</div><div class="note">同じ番号を繰り返し選んでもよい。</div>';
      }
      if(p.check){
        h+='<div class="note">正しいものをすべて選んでください。</div><div id="c41">';
        STMT41.forEach((s,i)=>h+=`<label class="cb" id="cb41_${i}"><input type="checkbox"> ${'①②③④⑤⑥⑦'[i]} ${s}</label>`);
        h+=`</div><div class="ib"><button onclick="chk41(false)">確認</button><button class="s" onclick="chk41(true)">答え</button><span class="res" id="r41"></span></div>`;
        return;
      }
      h+='<ol class="q">';
      p.q.forEach((t,i)=>{
        const ids=[];
        const html=t.replace(/\[\[([^:\]]+):([^\]]+)\]\]/g,(m,l,spec)=>{const b=bl(l,spec);ids.push(b.idx);return b.html;});
        h+=`<li data-n="${NUM[i]||i+1}" data-ids="${ids.join(',')}">${html}<span class="ib"><button onclick="chkItem(this,false)">確認</button><button class="s" onclick="chkItem(this,true)">答え</button><span class="res"></span></span></li>`;
      });
      h+='</ol>';
    });
    sec.innerHTML=h+'</div>';root.appendChild(sec);
  });
}
render();

function val(b){return document.getElementById(b.id).value;}
function isOk(b){
  const v=val(b);if(!v)return false;
  if(b.type==='sel')return +v===b.ans;
  if(b.type==='ch')return v===b.ans;
  const n=norm(v);
  if(b.grp){
    const mem=groups[b.grp];
    const pool=[].concat(...mem.map(i=>checks[i].alts)).map(norm);
    if(!pool.includes(n))return false;
    // 他メンバーと同じ答えは不可（先に入力された側を優先）
    return !mem.some(i=>i<b.idx&&norm(val(checks[i]))===n);
  }
  return b.alts.some(a=>norm(a)===n);
}
function mark(b,reveal){
  const el=document.getElementById(b.id),a=document.getElementById(b.id+'a');
  el.classList.remove('ok','ng');a.textContent='';
  if(isOk(b)){el.classList.add('ok');return true;}
  if(val(b)||reveal)el.classList.add('ng');
  if(reveal)a.textContent='→ '+(b.grp?groups[b.grp].map(i=>checks[i].show).join('・')+'（順不同）':b.show);
  return false;
}
function chkItem(btn,reveal){
  const li=btn.closest('li'),ids=li.dataset.ids.split(',').filter(x=>x!=='').map(Number);
  let n=0,empty=0;
  ids.forEach(i=>{if(!val(checks[i]))empty++;if(mark(checks[i],reveal))n++;});
  const r=li.querySelector('.res');
  if(reveal){r.textContent=`正解 ${n}/${ids.length}`;r.style.color=n===ids.length?'var(--ok)':'var(--ng)';}
  else if(empty===ids.length){r.textContent='未入力です';r.style.color='#888';}
  else if(n===ids.length){r.textContent='⭕ 正解！';r.style.color='var(--ok)';}
  else{r.textContent=`❌ ${n}/${ids.length} 正解（まちがいを直してみよう）`;r.style.color='var(--ng)';}
  updateScore();
}
function chk41(reveal){
  const sel=[...document.querySelectorAll('#c41 input')];
  let good=true;
  sel.forEach((c,i)=>{
    const lab=document.getElementById('cb41_'+i);lab.classList.remove('ok','ng');
    const should=ANS41.includes(i);
    if(c.checked!==should)good=false;
    if(reveal){if(should)lab.classList.add('ok');else if(c.checked)lab.classList.add('ng');}
    else if(c.checked)lab.classList.add(should?'ok':'ng');
  });
  const r=document.getElementById('r41');
  if(reveal){r.textContent='正解：'+ANS41.map(i=>'①②③④⑤⑥⑦'[i]).join('');r.style.color='var(--ok)';}
  else if(!sel.some(c=>c.checked)){r.textContent='未選択です';r.style.color='#888';}
  else{r.textContent=good?'⭕ 正解！':'❌ もう一度考えてみよう';r.style.color=good?'var(--ok)':'var(--ng)';}
  ok41=good&&sel.some(c=>c.checked);
  updateScore();
}
function updateScore(){
  const n=checks.filter(b=>document.getElementById(b.id).classList.contains('ok')).length+(ok41?1:0);
  document.getElementById('score').textContent=`正解 ${n} / ${checks.length+1}`;
}
function checkAll(){
  checks.forEach(b=>mark(b,false));
  document.querySelectorAll('li .res').forEach(r=>r.textContent='');
  chk41(false);
}
function showAll(){
  checks.forEach(b=>mark(b,true));
  document.querySelectorAll('li .res').forEach(r=>r.textContent='');
  chk41(true);ok41=false;updateScore();
}
function resetAll(){
  checks.forEach(b=>{const el=document.getElementById(b.id);el.value='';el.classList.remove('ok','ng');document.getElementById(b.id+'a').textContent='';});
  document.querySelectorAll('#c41 input').forEach((c,i)=>{c.checked=false;document.getElementById('cb41_'+i).classList.remove('ok','ng');});
  document.querySelectorAll('.res').forEach(r=>r.textContent='');
  ok41=false;updateScore();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.blank')){
    const li=e.target.closest('li');li.querySelector('.ib button').click();
  }
});
updateScore();
</script>
</body>
</html>
